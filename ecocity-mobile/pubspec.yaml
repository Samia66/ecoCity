name: ecocity_mobile
description: Application mobile officielle EcoCity (Citoyen / Agent / Chef d'équipe)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State management & routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1
  pretty_dio_logger: ^1.4.0

  # Models / codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Location / maps
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geocoding: ^3.0.0

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI / UX
  shimmer: ^3.0.0
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.69.2

  # Utils
  logger: ^2.5.0
  equatable: ^2.0.7
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
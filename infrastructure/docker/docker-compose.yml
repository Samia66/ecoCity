# Infrastructure CIBLE (roadmap) : Redis (cache), MinIO (stockage objet des
# pièces jointes) et Mailpit (emails transactionnels) ne sont pas encore
# utilisés par ecocity-backend — voir la note dans ecocity-backend/README.md.
# Pour le développement actuel, utilisez plutôt ecocity-backend/docker-compose.yml
# (Postgres seul), qui correspond à ce que le code lit réellement.
# Ce fichier nécessite un .env avec POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB,
# MINIO_ROOT_USER/MINIO_ROOT_PASSWORD, MAILPIT_HTTP_PORT/MAILPIT_SMTP_PORT.
services:

  postgres:
    image: postgres:16
    container_name: ecocity-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    container_name: ecocity-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


  minio:
    image: minio/minio

    container_name: ecocity-minio

    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data


  mailpit:
    image: axllent/mailpit

    container_name: ecocity-mailpit

    restart: unless-stopped

    ports:
      - "${MAILPIT_HTTP_PORT}:8025"
      - "${MAILPIT_SMTP_PORT}:1025"


volumes:

  postgres_data:

  redis_data:

  minio_data:
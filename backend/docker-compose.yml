
services:

  postgres:
    image: postgres:16

    restart: always

    container_name: ecocity-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecocity

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:

    build: .

    container_name: ecocity-api

    depends_on:
      - postgres

    ports:
      - "3001:3000"

    env_file:
      - .env

volumes:

  postgres_data:
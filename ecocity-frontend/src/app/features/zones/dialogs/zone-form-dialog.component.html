<h2 mat-dialog-title>{{ isEdit ? 'Modifier la zone' : 'Nouvelle zone' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="eco-dialog-form">
    <mat-form-field appearance="outline" class="eco-form-field">
      <mat-label>Nom de la zone</mat-label>
      <input matInput formControlName="name" placeholder="Ex : Centre-ville" />
      @if (f.name.touched && f.name.invalid) {
        <mat-error>Le nom est requis</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="eco-form-field">
      <mat-label>Description</mat-label>
      <textarea matInput rows="3" formControlName="description" placeholder="Optionnel"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close>Annuler</button>
  <eco-button [loading]="submitting()" (click)="submit()">{{ isEdit ? 'Enregistrer' : 'Créer' }}</eco-button>
</mat-dialog-actions>

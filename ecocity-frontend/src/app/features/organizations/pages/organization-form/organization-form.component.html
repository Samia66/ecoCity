<h2 mat-dialog-title>{{ isEdit ? "Modifier l'organisation" : 'Nouvelle organisation' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="eco-dialog-form">
    <mat-form-field appearance="outline" class="eco-form-field">
      <mat-label>Nom de l'organisation</mat-label>
      <input matInput formControlName="name" placeholder="Ex : Mairie de Cotonou" />
    </mat-form-field>
    <div class="eco-form-row">
      <mat-form-field appearance="outline" class="eco-form-field">
        <mat-label>Ville</mat-label>
        <input matInput formControlName="city" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="eco-form-field">
        <mat-label>Téléphone</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline" class="eco-form-field">
      <mat-label>Adresse</mat-label>
      <input matInput formControlName="address" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="eco-form-field">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close>Annuler</button>
  <eco-button [loading]="submitting()" (click)="submit()">{{ isEdit ? 'Enregistrer' : 'Créer' }}</eco-button>
</mat-dialog-actions>

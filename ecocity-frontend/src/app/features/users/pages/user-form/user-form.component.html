<h2 mat-dialog-title>{{ isEdit ? "Modifier l'utilisateur" : 'Nouvel utilisateur' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="eco-dialog-form">
    <div class="eco-form-row">
      <mat-form-field appearance="outline" class="eco-form-field">
        <mat-label>Prénom</mat-label>
        <input matInput formControlName="firstName" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="eco-form-field">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="lastName" />
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline" class="eco-form-field">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" />
    </mat-form-field>
    <mat-form-field appearance="outline" class="eco-form-field">
      <mat-label>Rôle</mat-label>
      <mat-select formControlName="role">
        @for (r of roles; track r[0]) { <mat-option [value]="r[0]">{{ r[1] }}</mat-option> }
      </mat-select>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-stroked-button mat-dialog-close>Annuler</button>
  <eco-button [loading]="submitting()" (click)="submit()">{{ isEdit ? 'Enregistrer' : 'Créer' }}</eco-button>
</mat-dialog-actions>

<div class="eco-auth-centered">
  <div class="eco-auth-centered__card">
    <div class="eco-auth-centered__logo">🌿</div>
    <h2>Réinitialiser le mot de passe</h2>
    <p class="eco-auth-centered__subtitle">Choisissez un nouveau mot de passe pour votre compte.</p>

    @if (backendError()) {
      <div class="eco-form-backend-error"><mat-icon>error_outline</mat-icon><span>{{ backendError() }}</span></div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <eco-password-input label="Nouveau mot de passe" formControlName="password" [errorMessage]="f.password.touched && f.password.invalid ? '6 caractères minimum' : ''" />
      <eco-password-input label="Confirmer le mot de passe" formControlName="confirmPassword" />
      <eco-button type="submit" [loading]="loading()" [block]="true">Réinitialiser</eco-button>
    </form>

    <p class="eco-auth-centered__footer"><a routerLink="/login">← Retour à la connexion</a></p>
  </div>
</div>

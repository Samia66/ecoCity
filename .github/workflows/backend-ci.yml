name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'ecocity-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'ecocity-backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: ecocity-backend

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ecocity-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --coverage

      - name: Build
        run: npm run build

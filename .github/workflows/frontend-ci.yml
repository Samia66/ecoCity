name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'ecocity-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'ecocity-frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: ecocity-frontend

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ecocity-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (headless Chrome)
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadlessNoSandbox

      - name: Build
        run: npx ng build
